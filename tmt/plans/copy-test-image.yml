---
- name: Copy build-under-test image archive from the TMT controller to target
  hosts: target
  gather_facts: false
  tasks:
    - name: Read TMT plan data directory
      ansible.builtin.set_fact:
        package_mode_plan_data: "{{ lookup('ansible.builtin.env', 'TMT_PLAN_DATA') }}"

    - name: Validate TMT plan data directory
      ansible.builtin.assert:
        that:
          - package_mode_plan_data is match('^/(?:[^/]+/)*run-[^/]+/tmt/plans/package-mode/data$')
        fail_msg: >-
          TMT_PLAN_DATA must be an absolute path ending in
          /run-<id>/tmt/plans/package-mode/data before accessing the package-mode
          archive.

    - name: Canonicalize TMT plan data directory on the controller
      ansible.builtin.command:
        argv:
          - realpath
          - -e
          - --
          - "{{ package_mode_plan_data }}"
      delegate_to: localhost
      register: canonical_plan_data
      changed_when: false
      failed_when: false

    - name: Require the canonical TMT plan data directory
      ansible.builtin.assert:
        that:
          - canonical_plan_data.rc == 0
          - canonical_plan_data.stdout == package_mode_plan_data
          - canonical_plan_data.stdout is match('^/(?:[^/]+/)*run-[^/]+/tmt/plans/package-mode/data$')
          - canonical_plan_data.stdout is search('/tmt/plans/package-mode/data$')
        fail_msg: >-
          TMT_PLAN_DATA must be the canonical, existing controller path ending
          in /tmt/plans/package-mode/data; symlinks and non-canonical paths are
          not allowed.

    - name: Set the run-specific controller staging paths
      ansible.builtin.set_fact:
        package_mode_staging_dir: "{{ package_mode_plan_data }}/package-mode-transfer"
        package_mode_archive: "{{ package_mode_plan_data }}/package-mode-transfer/bootc-to-existing-root-preserve-var-merge-etc.oci"

    - name: Copy and verify the staged image archive
      block:
        - name: Inspect the staged image archive on the controller
          ansible.builtin.stat:
            path: "{{ package_mode_archive }}"
            checksum_algorithm: sha256
          delegate_to: localhost
          register: staged_archive

        - name: Require the staged image archive
          ansible.builtin.assert:
            that:
              - staged_archive.stat.exists
              - staged_archive.stat.isreg
            fail_msg: >-
              The generated image archive is missing from the controller
              staging directory. The harness-to-controller transfer must
              complete before copying it to the target.

        - name: Stream the generated image archive to the target
          ansible.posix.synchronize:
            src: "{{ package_mode_archive }}"
            dest: /var/tmp/bootc-to-existing-root-preserve-var-merge-etc.oci
            mode: push
            checksum: true
            owner: false
            group: false
            rsync_opts:
              - --chmod=F600
            use_ssh_args: true
          ignore_unreachable: true
          register: archive_transfer

        - name: Require a reachable target transfer
          ansible.builtin.assert:
            that:
              - not (archive_transfer.unreachable | default(false))
            fail_msg: The target became unreachable while copying the package-mode archive.

        - name: Inspect the copied image archive on the target
          ansible.builtin.stat:
            path: /var/tmp/bootc-to-existing-root-preserve-var-merge-etc.oci
            checksum_algorithm: sha256
          ignore_unreachable: true
          register: target_archive

        - name: Verify the generated image archive transfer to the target
          ansible.builtin.assert:
            that:
              - >-
                not (target_archive.unreachable | default(false)) and
                target_archive.stat.exists and
                target_archive.stat.checksum == staged_archive.stat.checksum
            fail_msg: The generated image archive SHA256 differs after transfer to the target.

      always:
        - name: Remove controller staging after copy attempt
          ansible.builtin.file:
            path: "{{ package_mode_staging_dir }}"
            state: absent
          delegate_to: localhost
