---
- name: Copy locally built package-mode image archive to the harness
  hosts: harness
  gather_facts: false
  tasks:
    - name: Inspect the local image archive on the controller
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../target/package-mode-local.oci"
        checksum_algorithm: sha256
      delegate_to: localhost
      register: local_archive

    - name: Require the local image archive
      ansible.builtin.assert:
        that:
          - local_archive.stat.exists
          - local_archive.stat.isreg
        fail_msg: >-
          The local package-mode OCI archive was not found at
          target/package-mode-local.oci. Build it with
          just test-tmt-package-mode before running the TMT plan.

    - name: Stream the local image archive to the harness
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../target/package-mode-local.oci"
        dest: /var/tmp/bootc-package-mode-local.oci
        mode: push
        checksum: true
        owner: false
        group: false
        rsync_opts:
          - --chmod=F600
        use_ssh_args: true

    - name: Inspect the copied image archive on the harness
      ansible.builtin.stat:
        path: /var/tmp/bootc-package-mode-local.oci
        checksum_algorithm: sha256
      register: harness_archive

    - name: Verify the local image archive transfer
      ansible.builtin.assert:
        that:
          - harness_archive.stat.exists
          - harness_archive.stat.checksum == local_archive.stat.checksum
        fail_msg: The local image archive SHA256 differs after transfer to the harness.
