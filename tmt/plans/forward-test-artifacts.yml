---
- name: Forward Testing Farm artifacts from the TMT controller to the harness
  hosts: harness
  gather_facts: false
  tasks:
    - name: Check the controller artifact repository exists
      ansible.builtin.stat:
        path: /var/share/test-artifacts
      delegate_to: localhost
      register: artifact_repository

    - name: Check the controller artifact repository configuration exists
      ansible.builtin.stat:
        path: /etc/yum.repos.d/test-artifacts.repo
      delegate_to: localhost
      register: artifact_repository_config

    - name: Check whether the controller ARTIFACTS directory exists
      ansible.builtin.stat:
        path: /var/ARTIFACTS
      delegate_to: localhost
      register: artifacts_directory

    - name: Validate controller artifact paths
      ansible.builtin.assert:
        that:
          - artifact_repository.stat.exists
          - artifact_repository.stat.isdir
          - artifact_repository_config.stat.exists
          - artifact_repository_config.stat.isreg
        fail_msg: >-
          Cannot forward package-mode test artifacts: the TMT controller must
          provide the /var/share/test-artifacts/ directory,
          and /etc/yum.repos.d/test-artifacts.repo file.

    - name: Find source RPMs in the controller artifact repository
      ansible.builtin.find:
        paths: /var/share/test-artifacts
        patterns: '*.src.rpm'
        recurse: false
        file_type: file
      delegate_to: localhost
      register: source_rpms

    - name: Validate the controller artifact repository contains a source RPM
      ansible.builtin.assert:
        that:
          - source_rpms.matched | int == 1
        fail_msg: >-
          Cannot forward package-mode test artifacts: exactly one top-level
          .src.rpm file must be present in /var/share/test-artifacts/ on the
          TMT controller.

    - name: Calculate SHA256 checksums for controller artifact files
      ansible.builtin.find:
        paths: /var/share/test-artifacts
        recurse: true
        file_type: file
        get_checksum: true
        checksum_algorithm: sha256
      delegate_to: localhost
      register: source_artifacts

    - name: Create the artifact repository directory on the harness
      ansible.builtin.file:
        path: /var/share/test-artifacts
        state: directory
        mode: '0755'

    - name: Stream the full artifact repository to the harness
      ansible.posix.synchronize:
        src: /var/share/test-artifacts/
        dest: /var/share/test-artifacts/
        checksum: true
        owner: false
        group: false
        use_ssh_args: true

    - name: Calculate SHA256 checksums for harness artifact files
      ansible.builtin.find:
        paths: /var/share/test-artifacts
        recurse: true
        file_type: file
        get_checksum: true
        checksum_algorithm: sha256
      register: harness_artifacts

    - name: Verify the artifact repository transfer
      ansible.builtin.assert:
        that:
          - >-
            (source_artifacts.files | map(attribute='path')
            | map('regex_replace', '^/var/share/test-artifacts/', '')
            | zip(source_artifacts.files | map(attribute='checksum'))
            | list | sort)
            ==
            (harness_artifacts.files | map(attribute='path')
            | map('regex_replace', '^/var/share/test-artifacts/', '')
            | zip(harness_artifacts.files | map(attribute='checksum'))
            | list | sort)
        fail_msg: The artifact repository SHA256 manifest differs after transfer to the harness.

    - name: Copy the artifact repository configuration to the harness
      ansible.builtin.copy:
        src: /etc/yum.repos.d/test-artifacts.repo
        dest: /etc/yum.repos.d/test-artifacts.repo
        owner: root
        group: root
        mode: '0644'

    - name: Calculate SHA256 checksums for controller ARTIFACTS files
      ansible.builtin.find:
        paths: /var/ARTIFACTS
        recurse: true
        file_type: file
        get_checksum: true
        checksum_algorithm: sha256
      delegate_to: localhost
      register: source_artifacts_directory
      when: artifacts_directory.stat.exists and artifacts_directory.stat.isdir

    - name: Create the ARTIFACTS directory on the harness
      ansible.builtin.file:
        path: /var/ARTIFACTS
        state: directory
        mode: '0755'
      when: artifacts_directory.stat.exists and artifacts_directory.stat.isdir

    - name: Stream optional ARTIFACTS to the harness
      ansible.posix.synchronize:
        src: /var/ARTIFACTS/
        dest: /var/ARTIFACTS/
        checksum: true
        owner: false
        group: false
        use_ssh_args: true
      when: artifacts_directory.stat.exists and artifacts_directory.stat.isdir

    - name: Calculate SHA256 checksums for harness ARTIFACTS files
      ansible.builtin.find:
        paths: /var/ARTIFACTS
        recurse: true
        file_type: file
        get_checksum: true
        checksum_algorithm: sha256
      register: harness_artifacts_directory
      when: artifacts_directory.stat.exists and artifacts_directory.stat.isdir

    - name: Verify the optional ARTIFACTS transfer
      ansible.builtin.assert:
        that:
          - >-
            (source_artifacts_directory.files | map(attribute='path')
            | map('regex_replace', '^/var/ARTIFACTS/', '')
            | zip(source_artifacts_directory.files | map(attribute='checksum'))
            | list | sort)
            ==
            (harness_artifacts_directory.files | map(attribute='path')
            | map('regex_replace', '^/var/ARTIFACTS/', '')
            | zip(harness_artifacts_directory.files | map(attribute='checksum'))
            | list | sort)
        fail_msg: The ARTIFACTS SHA256 manifest differs after transfer to the harness.
      when: artifacts_directory.stat.exists and artifacts_directory.stat.isdir
