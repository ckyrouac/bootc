---
- name: Remove package-mode controller staging for this TMT run
  hosts: harness
  gather_facts: false
  tasks:
    - name: Require TMT plan data directory
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'TMT_PLAN_DATA') | length > 0
        fail_msg: TMT_PLAN_DATA must be set before cleaning package-mode staging.

    - name: Remove run-specific controller staging
      ansible.builtin.file:
        path: "{{ lookup('ansible.builtin.env', 'TMT_PLAN_DATA') }}/package-mode-transfer"
        state: absent
      delegate_to: localhost
