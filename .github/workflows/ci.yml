name: CI

permissions:
  actions: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'control/skip-ci') }}
    runs-on: ubuntu-latest
    container: quay.io/coreos-assembler/fcos-buildroot:testing-devel
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: ./ci/installdeps.sh
      - name: Mark git checkout as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # xref containers/containers-image-proxy-rs
      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: "tests"
      - name: make validate-rust
        # the ruff checks are covered via a dedicated action
        run: make validate-rust
      - name: Run tests
        run: cargo test -- --nocapture --quiet
      - name: Manpage generation
        run: mkdir -p target/man && cargo run --features=docgen -- man --directory target/man
      - name: Clippy (gate on correctness and suspicous)
        run: make validate-rust
  fedora-container-tests:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'control/skip-ci') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build container (fedora)
        run: sudo podman build --build-arg=base=quay.io/fedora/fedora-bootc:41 -t localhost/bootc -f hack/Containerfile . 
      - name: Container integration
        run: sudo podman run --rm localhost/bootc bootc-integration-tests container
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: EmbarkStudios/cargo-deny-action@v2
      with:
        log-level: warn
        command: check -A duplicate bans sources licenses
  install-tests:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'control/skip-ci') }}
    name: "Test install"
    # For a not-ancient podman
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Free up disk space on runner
        run: sudo ./ci/clean-gha-runner.sh
      - name: Integration tests
        run: |
          set -xeu
          sudo podman build -t localhost/bootc -f hack/Containerfile .
          export CARGO_INCREMENTAL=0  # because we aren't caching the test runner bits
          cargo build --release -p tests-integration
          df -h /
          sudo install -m 0755 target/release/tests-integration /usr/bin/bootc-integration-tests
          rm target -rf
          df -h /
          # The ostree-container tests
          sudo podman run --privileged --pid=host -v /:/run/host -v $(pwd):/src:ro -v /var/tmp:/var/tmp \
            -v /run/dbus:/run/dbus -v /run/systemd:/run/systemd localhost/bootc /src/ostree-ext/ci/priv-integration.sh
          # Nondestructive but privileged tests
          sudo bootc-integration-tests host-privileged localhost/bootc
          # Finally the install-alongside suite
          sudo bootc-integration-tests install-alongside localhost/bootc
  tmt-multi-device-esp:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'control/skip-ci') }}
    name: "TMT: multi-device ESP"
    runs-on: ubuntu-24.04
    env:
      LIBVIRT_DEFAULT_URI: qemu:///session
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootc Ubuntu Setup (libvirt + KVM)
        uses: bootc-dev/actions/bootc-ubuntu-setup@main
        with:
          libvirt: true

      - name: Install tmt
        uses: ./.github/actions/install-tmt

      - name: Install nushell
        run: |
          set -xeuo pipefail
          NU_VERSION=0.114.1
          td=$(mktemp -d)
          curl --retry 5 --retry-delay 10 -sSL \
            "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/nu-${NU_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o "${td}/nu.tar.gz"
          sudo tar -xz --strip-components=1 -C /usr/local/bin -f "${td}/nu.tar.gz" \
            "nu-${NU_VERSION}-x86_64-unknown-linux-musl/nu"
          rm -rf "${td}"
          nu --version

      - name: Free up disk space
        run: sudo ./ci/clean-gha-runner.sh

      - name: Build bootc container image
        run: |
          set -xeuo pipefail
          podman build -t localhost/bootc -f hack/Containerfile .

      - name: Run TMT multi-device ESP test
        run: |
          set -xuo pipefail
          # Generate a unique VM name
          VM_NAME="bootc-tmt-multi-device-esp-$$"

          # Boot a VM from the container image using bcvk + libvirt
          if ! bcvk libvirt run \
            --name "${VM_NAME}" \
            --detach \
            --label=bootc.test=1 \
            localhost/bootc; then
            echo "ERROR: bcvk libvirt run failed" >&2
            bcvk libvirt list || true
            df -h || true
            exit 1
          fi

          # Ensure VM cleanup on exit
          trap "bcvk libvirt rm --stop --force ${VM_NAME} || true" EXIT

          # Wait for VM to be ready and extract SSH connection details
          SSH_PORT=""
          SSH_KEY=""
          for i in $(seq 1 60); do
            INFO=$(bcvk libvirt inspect "${VM_NAME}" --format=json 2>/dev/null || true)
            echo "bcvk inspect output: ${INFO}" 
            SSH_PORT=$(echo "${INFO}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('ssh_port',''))" 2>/dev/null || true)
            SSH_KEY=$(echo "${INFO}"  | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('ssh_private_key',''))" 2>/dev/null || true)
            if [ -n "${SSH_PORT}" ] && [ -n "${SSH_KEY}" ]; then
              echo "VM ready: SSH port ${SSH_PORT}"
              break
            fi
            echo "Waiting for VM to be ready (attempt ${i}/60)..."
            sleep 5
          done

          if [ -z "${SSH_PORT}" ]; then
            echo "ERROR: VM failed to become ready after 300s" >&2
            bcvk libvirt list || true
            exit 1
          fi

          # Write SSH key to temp file
          KEY_FILE=$(mktemp)
          echo "${SSH_KEY}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"

          # Verify SSH connectivity
          SSH_OK=false
          for i in $(seq 1 60); do
            if ssh -i "${KEY_FILE}" -p "${SSH_PORT}" \
                -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=5 -o IdentitiesOnly=yes \
                root@localhost 'echo ready' 2>/dev/null; then
              SSH_OK=true
              break
            fi
            echo "Waiting for SSH (attempt ${i}/60)..."
            sleep 5
          done

          if [ "${SSH_OK}" != "true" ]; then
            echo "ERROR: SSH never became available" >&2
            exit 1
          fi

          # Run tmt tests via the connect provisioner (SSH into the running VM).
          # Pass running_env=image_mode to skip prepare steps that only apply
          # to package-mode (non-image-mode) systems, matching upstream behaviour.
          tmt -vvv --context=running_env=image_mode \
            run --id "multi-device-esp-${VM_NAME}" --all \
            provision --how=connect \
              --guest=localhost \
              --user=root \
              --port="${SSH_PORT}" \
              --key="${KEY_FILE}" \
            plan --name /plans/test-32-multi-device-esp
          TMT_RC=$?

          echo "=== TMT result: exit code ${TMT_RC} ==="

          # Copy the per-scenario log from the VM to the runner
          scp -i "${KEY_FILE}" -P "${SSH_PORT}" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o IdentitiesOnly=yes \
            root@localhost:/var/tmp/bootc-esp-test.log \
            /var/tmp/bootc-esp-test.log 2>/dev/null || true

          exit ${TMT_RC}

      - name: Show TMT results
        if: always()
        run: |
          echo "=== bootc ESP per-scenario test log ==="
          if [ -f /var/tmp/bootc-esp-test.log ]; then
            cat /var/tmp/bootc-esp-test.log
            content=$(cat /var/tmp/bootc-esp-test.log | tr '\n' '|' | head -c 2000)
            echo "::error title=bootc ESP test log::${content}"
          else
            echo "No per-scenario log found (test may not have started)"
            echo "::error title=No test log::bootc-esp-test.log not found - test may have failed before writing it"
          fi
          echo ""
          echo "=== tmt output files ==="
          find /var/tmp/tmt -name "output.txt" 2>/dev/null | while read f; do
            echo "--- $f ---"
            cat "$f" || true
          done

      - name: Archive TMT logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmt-logs-multi-device-esp
          path: |
            /var/tmp/tmt
            /var/tmp/bootc-esp-test.log
          if-no-files-found: ignore
  docs:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'documentation') }}
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.4.37
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          tag=$(curl 'https://api.github.com/repos/rust-lang/mdbook/releases/latest' | jq -r '.tag_name')
          url="https://github.com/rust-lang/mdbook/releases/download/${tag}/mdbook-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir mdbook
          curl -sSL $url | tar -xz --directory=./mdbook
          echo `pwd`/mdbook >> $GITHUB_PATH
      - name: Install mdbook-mermaid
        run: |
          tag=$(curl 'https://api.github.com/repos/badboy/mdbook-mermaid/releases/latest' | jq -r '.tag_name')
          url="https://github.com/badboy/mdbook-mermaid/releases/download/${tag}/mdbook-mermaid-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir mdbook-mermaid
          curl -sSL $url | tar -xz --directory=./mdbook-mermaid
          echo `pwd`/mdbook-mermaid >> $GITHUB_PATH
      - name: Install mdbook-linkcheck
        run: |
          tag=$(curl 'https://api.github.com/repos/Michael-F-Bryan/mdbook-linkcheck/releases/latest' | jq -r '.tag_name')
          archive="mdbook-linkcheck.x86_64-unknown-linux-gnu.zip"
          url="https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/${tag}/${archive}"
          mkdir mdbook-linkcheck
          curl -sSL -O $url && unzip ${archive} -d ./mdbook-linkcheck && chmod +x ./mdbook-linkcheck/mdbook-linkcheck
          echo `pwd`/mdbook-linkcheck >> $GITHUB_PATH
      - name: Build with mdBook
        run: cd docs && mdbook-mermaid install && mdbook build
