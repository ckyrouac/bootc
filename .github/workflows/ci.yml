name: CI

permissions:
  actions: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'control/skip-ci') }}
    runs-on: ubuntu-latest
    container: quay.io/coreos-assembler/fcos-buildroot:testing-devel
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: ./ci/installdeps.sh
      - name: Mark git checkout as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # xref containers/containers-image-proxy-rs
      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: "tests"
      - name: make validate-rust
        # the ruff checks are covered via a dedicated action
        run: make validate-rust
      - name: Run tests
        run: cargo test -- --nocapture --quiet
      - name: Manpage generation
        run: mkdir -p target/man && cargo run --features=docgen -- man --directory target/man
      - name: Clippy (gate on correctness and suspicous)
        run: make validate-rust
  fedora-container-tests:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'control/skip-ci') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build container (fedora)
        run: sudo podman build --build-arg=base=quay.io/fedora/fedora-bootc:41 -t localhost/bootc -f hack/Containerfile . 
      - name: Container integration
        run: sudo podman run --rm localhost/bootc bootc-integration-tests container
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: EmbarkStudios/cargo-deny-action@v2
      with:
        log-level: warn
        command: check -A duplicate bans sources licenses
  install-tests:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'control/skip-ci') }}
    name: "Test install"
    # For a not-ancient podman
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Free up disk space on runner
        run: sudo ./ci/clean-gha-runner.sh
      - name: Integration tests
        run: |
          set -xeu
          sudo podman build -t localhost/bootc -f hack/Containerfile .
          export CARGO_INCREMENTAL=0  # because we aren't caching the test runner bits
          cargo build --release -p tests-integration
          df -h /
          sudo install -m 0755 target/release/tests-integration /usr/bin/bootc-integration-tests
          rm target -rf
          df -h /
          # The ostree-container tests
          sudo podman run --privileged --pid=host -v /:/run/host -v $(pwd):/src:ro -v /var/tmp:/var/tmp \
            -v /run/dbus:/run/dbus -v /run/systemd:/run/systemd localhost/bootc /src/ostree-ext/ci/priv-integration.sh
          # Nondestructive but privileged tests
          sudo bootc-integration-tests host-privileged localhost/bootc
          # Finally the install-alongside suite
          sudo bootc-integration-tests install-alongside localhost/bootc
  # Run the booted TMT test suite (plans/test-NN-*.fmf).
  #
  # Each plan declares its own `provision: how: bootc` (build+boot via the
  # tmt+provision-bootc plugin), but that plugin was unreliable in this GH
  # Actions environment (connection-refused loops -- see
  # docs/tmt-debug-session-state.md for the full history). Instead we build
  # the image ourselves, boot it with bcvk+libvirt, and point tmt at it via
  # the `connect` provisioner (CLI-level `provision --how=connect` overrides
  # whatever each plan's own `provision:` step says). This is the same
  # underlying approach (bcvk + libvirt + tmt connect) upstream
  # bootc-dev/bootc uses, just done here with explicit shell steps instead
  # of upstream's `cargo xtask run-tmt` (which doesn't exist in this
  # v1.1.6-based branch).
  #
  # plans/integration.fmf is intentionally not included: it's a
  # Testing-Farm-oriented meta-plan that provisions a bare-metal machine and
  # re-runs all of these plans again internally, which would be redundant
  # (and isn't suited to a lightweight GH Actions runner) given we already
  # run each plan directly below.
  tmt-suite:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'control/skip-ci') }}
    name: "TMT: ${{ matrix.label }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LIBVIRT_DEFAULT_URI: qemu:///session
    strategy:
      fail-fast: false
      matrix:
        include:
          - plan: test-01-readonly
            label: readonly
            containerfile: hack/Containerfile
          # Uses tmt-reboot (twice). This is the first time this repo has
          # exercised tmt's reboot handling over the `connect` provisioner
          # against a bcvk/libvirt guest -- the install-tmt action pins tmt
          # specifically because reboot handling has regressed before (see
          # its comment), so this plan is the most likely of the six to need
          # follow-up debugging if it fails.
          - plan: test-20-local-upgrade
            label: local-upgrade
            containerfile: hack/Containerfile
          # Also uses tmt-reboot (twice), plus pulls images from external
          # registries (quay.io, registry.access.redhat.com, docker.io) from
          # inside the guest at test runtime -- see comment above and
          # tests/booted/test-logically-bound-switch.nu.
          - plan: test-21-logically-bound-switch
            label: lbi-switch
            containerfile: hack/Containerfile
          - plan: test-22-logically-bound-install
            label: lbi-install
            containerfile: tests/containerfiles/lbi/Containerfile
          - plan: test-23-install-outside-container
            label: install-outside-container
            containerfile: hack/Containerfile
          - plan: test-32-multi-device-esp
            label: multi-device-esp
            containerfile: hack/Containerfile
            # This test mirrors its diagnostics to a plain file on the guest
            # (see tests/booted/test-multi-device-esp.nu) to work around
            # nushell losing buffered stdout on an uncaught error. Fetch it
            # after the tmt run; harmless no-op for plans that don't write it.
            guest_debug_log: /var/tmp/bootc-esp-test.log
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootc Ubuntu Setup (libvirt + KVM)
        uses: bootc-dev/actions/bootc-ubuntu-setup@main
        with:
          libvirt: true

      - name: Install tmt
        uses: ./.github/actions/install-tmt

      - name: Install nushell
        run: |
          set -xeuo pipefail
          NU_VERSION=0.114.1
          td=$(mktemp -d)
          curl --retry 5 --retry-delay 10 -sSL \
            "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/nu-${NU_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o "${td}/nu.tar.gz"
          sudo tar -xz --strip-components=1 -C /usr/local/bin -f "${td}/nu.tar.gz" \
            "nu-${NU_VERSION}-x86_64-unknown-linux-musl/nu"
          rm -rf "${td}"
          nu --version

      - name: Free up disk space
        run: sudo ./ci/clean-gha-runner.sh

      # test-22 boots an image whose bound-images.d (see
      # tests/containerfiles/lbi/Containerfile) references these images by
      # name, and they need to get pulled during `bootc install`. This
      # mirrors what `cargo xtask test-tmt` does on the assumption that
      # having them warm in the runner's podman storage helps bcvk's
      # install step resolve them (bcvk can expose the runner's storage to
      # the guest via containers-storage transport). If this turns out not
      # to matter for how bcvk performs the install, this step is a
      # harmless no-op and can be removed.
      - name: Pre-pull LBI test images
        if: matrix.plan == 'test-22-logically-bound-install'
        run: |
          set -xeuo pipefail
          podman pull \
            quay.io/curl/curl-base:latest \
            quay.io/curl/curl:latest \
            registry.access.redhat.com/ubi9/podman:latest

      - name: Build bootc container image
        run: |
          set -xeuo pipefail
          podman build -t localhost/bootc -f "${{ matrix.containerfile }}" .

      - name: Run TMT plan (${{ matrix.plan }})
        run: |
          set -xuo pipefail
          # Generate a unique VM name
          VM_NAME="bootc-tmt-${{ matrix.label }}-$$"

          # Boot a VM from the container image using bcvk + libvirt.
          # Use --target-transport containers-storage so that bootc status inside
          # the VM shows transport=containers-storage (not registry), allowing
          # 'bootc image copy-to-storage' to export from the ostree object store
          # rather than trying to pull from docker://localhost which doesn't exist.
          if ! bcvk libvirt run \
            --name "${VM_NAME}" \
            --detach \
            --label=bootc.test=1 \
            --target-transport containers-storage \
            localhost/bootc; then
            echo "ERROR: bcvk libvirt run failed" >&2
            bcvk libvirt list || true
            df -h || true
            exit 1
          fi

          # Ensure VM cleanup on exit
          trap "bcvk libvirt rm --stop --force ${VM_NAME} || true" EXIT

          # Wait for VM to be ready and extract SSH connection details
          SSH_PORT=""
          SSH_KEY=""
          for i in $(seq 1 60); do
            INFO=$(bcvk libvirt inspect "${VM_NAME}" --format=json 2>/dev/null || true)
            echo "bcvk inspect output: ${INFO}" 
            SSH_PORT=$(echo "${INFO}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('ssh_port',''))" 2>/dev/null || true)
            SSH_KEY=$(echo "${INFO}"  | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('ssh_private_key',''))" 2>/dev/null || true)
            if [ -n "${SSH_PORT}" ] && [ -n "${SSH_KEY}" ]; then
              echo "VM ready: SSH port ${SSH_PORT}"
              break
            fi
            echo "Waiting for VM to be ready (attempt ${i}/60)..."
            sleep 5
          done

          if [ -z "${SSH_PORT}" ]; then
            echo "ERROR: VM failed to become ready after 300s" >&2
            bcvk libvirt list || true
            exit 1
          fi

          # Write SSH key to temp file
          KEY_FILE=$(mktemp)
          echo "${SSH_KEY}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"

          # Verify SSH connectivity
          SSH_OK=false
          for i in $(seq 1 60); do
            if ssh -i "${KEY_FILE}" -p "${SSH_PORT}" \
                -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=5 -o IdentitiesOnly=yes \
                root@localhost 'echo ready' 2>/dev/null; then
              SSH_OK=true
              break
            fi
            echo "Waiting for SSH (attempt ${i}/60)..."
            sleep 5
          done

          if [ "${SSH_OK}" != "true" ]; then
            echo "ERROR: SSH never became available" >&2
            exit 1
          fi

          # Run tmt tests via the connect provisioner (SSH into the running VM).
          # This overrides whatever each plan's own `provision:` step says
          # (see the job-level comment above for why).
          # Pass running_env=image_mode to skip prepare steps that only apply
          # to package-mode (non-image-mode) systems, matching upstream behaviour.
          tmt -vvv --context=running_env=image_mode \
            run --id "${{ matrix.label }}-${VM_NAME}" --all \
            provision --how=connect \
              --guest=localhost \
              --user=root \
              --port="${SSH_PORT}" \
              --key="${KEY_FILE}" \
            plan --name "/plans/${{ matrix.plan }}"
          TMT_RC=$?

          echo "=== TMT result: exit code ${TMT_RC} ==="

          # Fetch the test's own debug log from the guest, if this plan
          # writes one, while the VM is still up (the trap above destroys it
          # as soon as this step exits).
          GUEST_DEBUG_LOG="${{ matrix.guest_debug_log }}"
          if [ -n "${GUEST_DEBUG_LOG}" ]; then
            scp -i "${KEY_FILE}" -P "${SSH_PORT}" \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "root@localhost:${GUEST_DEBUG_LOG}" "${GUEST_DEBUG_LOG}" \
              || echo "No guest debug log found at ${GUEST_DEBUG_LOG}"
          fi

          exit ${TMT_RC}

      - name: Show TMT results
        if: always()
        run: |
          # Dump the tmt workdir to the step log using collapsible groups.
          # tmt's own logs live under CDN-backed artifacts that can be awkward
          # to reach, so surface the key files inline here too.
          dump() {
            local title="$1" file="$2"
            [ -f "$file" ] || return 0
            echo "::group::${title} (${file})"
            cat "$file"
            echo "::endgroup::"
          }

          echo "::group::tmt workdir listing"
          find /var/tmp/tmt -maxdepth 8 -type f 2>/dev/null | sort
          echo "::endgroup::"

          find /var/tmp/tmt -path "*/execute/results.yaml" -type f 2>/dev/null \
            | while read -r f; do dump "execute/results.yaml" "$f"; done
          find /var/tmp/tmt -path "*/prepare/results.yaml" -type f 2>/dev/null \
            | while read -r f; do dump "prepare/results.yaml" "$f"; done
          find /var/tmp/tmt -name "output.txt" -type f 2>/dev/null \
            | while read -r f; do dump "output.txt" "$f"; done
          find /var/tmp/tmt -name "failures.yaml" -type f 2>/dev/null \
            | while read -r f; do dump "failures.yaml" "$f"; done

          LATEST_LOG=$(find /var/tmp/tmt -name "tmt.log" -type f 2>/dev/null | sort | tail -1)
          dump "tmt.log (tail)" "${LATEST_LOG}"

          # Show the test's own guest-side debug log, if this plan writes
          # one and it was fetched in the previous step (see comment there).
          dump "guest debug log" "${{ matrix.guest_debug_log }}"

      - name: Archive TMT logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "tmt-logs-${{ matrix.label }}"
          path: |
            /var/tmp/tmt
            ${{ matrix.guest_debug_log }}
          if-no-files-found: ignore
  docs:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'documentation') }}
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.4.37
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          tag=$(curl 'https://api.github.com/repos/rust-lang/mdbook/releases/latest' | jq -r '.tag_name')
          url="https://github.com/rust-lang/mdbook/releases/download/${tag}/mdbook-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir mdbook
          curl -sSL $url | tar -xz --directory=./mdbook
          echo `pwd`/mdbook >> $GITHUB_PATH
      - name: Install mdbook-mermaid
        run: |
          tag=$(curl 'https://api.github.com/repos/badboy/mdbook-mermaid/releases/latest' | jq -r '.tag_name')
          url="https://github.com/badboy/mdbook-mermaid/releases/download/${tag}/mdbook-mermaid-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir mdbook-mermaid
          curl -sSL $url | tar -xz --directory=./mdbook-mermaid
          echo `pwd`/mdbook-mermaid >> $GITHUB_PATH
      - name: Install mdbook-linkcheck
        run: |
          tag=$(curl 'https://api.github.com/repos/Michael-F-Bryan/mdbook-linkcheck/releases/latest' | jq -r '.tag_name')
          archive="mdbook-linkcheck.x86_64-unknown-linux-gnu.zip"
          url="https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/${tag}/${archive}"
          mkdir mdbook-linkcheck
          curl -sSL -O $url && unzip ${archive} -d ./mdbook-linkcheck && chmod +x ./mdbook-linkcheck/mdbook-linkcheck
          echo `pwd`/mdbook-linkcheck >> $GITHUB_PATH
      - name: Build with mdBook
        run: cd docs && mdbook-mermaid install && mdbook build
